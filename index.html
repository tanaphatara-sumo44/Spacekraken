<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#141111">
<title>SPACE KRAKEN</title><style>
:root{--bg:#141111;--p:#1f1b1a;--p2:#2a2423;--ln:#3d3838;--ink:#efe9e3;--dim:#a2958d;--g:#85cc7c;--b:#7fcce7;--r:#e88787;--y:#e3c064;--v:#b48be0;
--f:ui-monospace,"SF Mono",Consolas,"Roboto Mono",monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f)}
button{font:inherit;color:inherit;cursor:pointer}input,select,textarea{font:inherit;color:var(--ink);background:#181414;border:1px solid var(--ln);border-radius:4px;padding:8px}
.w{max-width:680px;margin:0 auto;padding:0 12px 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(20,17,17,.95);border-bottom:1px solid var(--ln);padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top b{color:var(--b)}.pill{font-size:12px;border:1px solid var(--ln);border-radius:12px;padding:2px 8px;color:var(--dim)}
.pill.o2{color:var(--b)}.pill.cr{color:var(--y)}.pill.xp{color:var(--g)}
h2{font-size:17px;margin:18px 0 8px}h3{font-size:14px;margin:12px 0 6px;color:var(--dim)}
.c{background:var(--p);border:1px solid var(--ln);border-radius:6px;padding:12px;margin:10px 0}
.bt{background:var(--p2);border:1px solid var(--ln);border-radius:5px;padding:9px 12px;margin:3px 3px 3px 0}
.bt:hover{border-color:#6b5f59}.bt.pr{background:#23402f;border-color:#3d6c50;color:#dcf7e6}.bt.dg{background:#402323;border-color:#6c3d3d}
.bt.sm{padding:5px 9px;font-size:12.5px}.bt:disabled{opacity:.4;cursor:default}.bt.on{border-color:var(--b);color:var(--b)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.dim{color:var(--dim);font-size:12.5px}
.ev{white-space:pre-wrap;line-height:1.65;background:#1b1716;border-left:3px solid var(--g);padding:12px;border-radius:4px}
.log{font-size:12.5px;max-height:220px;overflow:auto;border:1px dashed var(--ln);border-radius:5px;padding:8px}
.log div{padding:2px 0;border-bottom:1px solid #26201f}.log .k{color:var(--y)}.log .x{color:var(--r)}.log .ok{color:var(--g)}
.crew{border:1px solid var(--ln);border-radius:6px;padding:9px;margin:6px 0;background:#191515}
.bar{height:6px;background:#2a2322;border-radius:3px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--g)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;background:#0c0a0a;padding:2px;border-radius:4px;max-width:520px;margin:0 auto}
.cl{aspect-ratio:1;font-size:clamp(8px,2.4vw,12px);display:flex;align-items:center;justify-content:center;border:none;padding:0;overflow:hidden}
.cl.e{background:#f2efe9;cursor:default}.cl.w{background:#050404;cursor:default}.cl.g{background:#8d8a88;color:#111}.cl.p{background:#9a74b8;color:#111}
.cl.bl{background:#6fc2dc;color:#111}.cl.G{background:#6cbf62;color:#111}.cl.y{background:#e3cf55;color:#111}.cl.r{background:#d15c5c;color:#111}
.cl.red{color:#b0101a;font-weight:700}.cl.me{outline:3px solid #fff;outline-offset:-3px;z-index:2;position:relative}
.cl.adj{box-shadow:inset 0 0 0 2px #7fcce7}.cl.done{opacity:.55}
.en{border:1px solid #5a3a3a;background:#211717;border-radius:6px;padding:8px;margin:5px 0}
.tag{display:inline-block;font-size:11px;border:1px solid var(--ln);border-radius:10px;padding:0 6px;margin:1px;color:var(--dim)}
.tabs{display:flex;gap:4px;overflow:auto;margin:8px 0}.tabs .bt{white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:12.5px}td{padding:4px;border-bottom:1px solid #2a2423;vertical-align:top}
.secret{border:1px solid var(--y);background:#241d13}
img.mp{width:100%;max-width:520px;display:block;margin:6px auto;border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#262020;border:1px solid var(--ln);padding:8px 14px;border-radius:6px;opacity:0;transition:.2s;z-index:99}
.toast.s{opacity:1}

body.role-table .w{max-width:1300px}.tvgrid{display:grid;grid-template-columns:1fr 300px;gap:18px}@media(max-width:820px){.tvgrid{grid-template-columns:1fr}}
.big{font-size:34px;margin:12px 0}.evbig .ev{font-size:21px;line-height:1.8}.sky{width:100%;height:320px;display:block;border-radius:8px;image-rendering:pixelated;background:#05040c;margin:8px 0}.sky.sm{height:140px}
.bar.big{height:12px}.foes{display:flex;flex-wrap:wrap;gap:14px}.foe{flex:1 1 200px;background:#211717;border:1px solid #5a3a3a;border-radius:8px;padding:12px;text-align:center}.foe .av{float:none;margin:0 auto 8px}.foe.dead{opacity:.35}
.votebar{display:flex;height:46px;border-radius:8px;overflow:hidden;margin-top:12px;font-weight:700;font-size:18px}.va{background:#6b4fd8;display:flex;align-items:center;justify-content:center}.vb{background:#2f7fa0;display:flex;align-items:center;justify-content:center}
.tl{display:flex;gap:4px;margin:10px 0;overflow:auto}.tlc{flex:1;min-width:66px;border:1px solid var(--ln);border-radius:6px;padding:6px;text-align:center;font-size:11px;background:#1b1716}.tlc span{display:block;font-size:20px;font-weight:700}.tlc small{color:var(--dim)}.tlc.now{border-color:var(--y);box-shadow:inset 0 0 0 2px var(--y)}.tlc.past{opacity:.4}
.twocol{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}@media(max-width:700px){.twocol{grid-template-columns:1fr}}body.role-table .grid{max-width:none}body.role-table .cl{font-size:clamp(10px,1.5vw,17px)}
.joinbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:16px}.code{font-size:46px;font-weight:700;letter-spacing:8px;color:var(--b)}#qr{background:#fff;padding:8px;border-radius:6px;min-width:10px}
.lineb{font-size:19px;padding:8px;border-bottom:1px solid var(--ln)}.kv{display:flex;justify-content:space-between;font-size:20px;padding:7px 0;border-bottom:1px solid var(--ln)}.mini{padding:6px 0;border-bottom:1px solid #2a2423}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:14px}.role input,.role select{margin:4px 0}.role>input{width:100%}.code-in{text-transform:uppercase}.warn{border-color:var(--y);color:var(--y);margin-top:12px}
.av{float:left;position:relative;border-radius:6px;margin:0 10px 4px 0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#f4ece6;border:1px solid var(--ln);overflow:hidden;flex:none}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ip{width:26px;height:26px;object-fit:contain;vertical-align:middle;margin-right:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0}.st{background:#181414;border:1px solid var(--ln);border-radius:4px;text-align:center;font-size:11px;color:var(--dim);padding:3px}.st b{display:block;font-size:16px;color:var(--ink)}
.bt.mini{padding:0 6px;font-size:11px;margin:0 0 0 4px}.give{max-width:140px;font-size:12px;padding:4px}.taken{opacity:.5}.phase{border-color:#6b4fd8}
.gbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#6b4fd8;border:none;color:#fff;font-size:24px;z-index:50;display:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.gov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:flex-end;justify-content:center}.gbox{background:var(--p);border:1px solid var(--ln);border-radius:12px 12px 0 0;padding:16px;max-width:680px;width:100%;max-height:82vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}.gbox li{margin:7px 0;line-height:1.55}
div.cl{cursor:default}
</style></head><body>
<div id="top"></div><div class="w" id="app"><p style="padding:40px 0" class="dim">กำลังโหลดข้อมูลภารกิจ…</p></div><div class="toast" id="toast"></div>
<button id="gbtn" class="gbtn" aria-label="วิธีเล่น">❓</button><div id="guide" class="gov"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script>
(async function(){
  try{if(window.firebase&&window.FIREBASE_CONFIG&&!/YOUR_/.test(FIREBASE_CONFIG.apiKey)){firebase.initializeApp(FIREBASE_CONFIG);window.FBDB=firebase.firestore()}}catch(e){console.error(e)}
  const J=f=>fetch('data/'+f).then(r=>{if(!r.ok)throw new Error(f+' ('+r.status+')');return r.json()});
  try{const [core,ev,maps,gear,crew,en]=await Promise.all([J('core.json'),J('events.json'),J('maps.json'),J('gear.json'),J('crew.json'),J('enemies.json')]);
    Object.assign(window,{CGM:core.CGM,SHIPS:core.SHIPS,FLIGHT:core.FLIGHT,EVT:ev,MAPS:maps,GEAR:gear,CREW:crew,ENEMIES:en});
    const s=document.createElement('script');s.src='engine.js';document.body.appendChild(s)}
  catch(e){document.getElementById('app').innerHTML='<div class="c warn">โหลดข้อมูลเกมไม่สำเร็จ: '+e.message+'<br>ต้องเปิดผ่านเว็บ (GitHub Pages หรือ local server) ห้ามดับเบิลคลิกไฟล์ index.html</div>'}
})();
</script></body></html>
