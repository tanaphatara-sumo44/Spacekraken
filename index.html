<style>
/* ── DESIGN TOKENS ── */
:root {
  --void:   #080610;  /* deep space black */
  --hull:   #12101d;  /* panel bg */
  --plate:  #1c1928;  /* card bg */
  --seam:   #2e2a42;  /* borders */

  --soft:   #a89ec2;

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; background: var(--void); color: var(--ink);
  font-family: var(--ui); font-size: 15px; line-height: 1.55; overscroll-behavior: none; }

/* ── LAYOUT ── */

/* ── TOPBAR ── */

}
.topbar .logo { font-family: var(--px); font-size: 10px; color: var(--plasma); letter-spacing: 1px; }
.topbar .logo span { color: var(--thrust); }
.pill { font-size: 11px; border: 1px solid var(--seam); border-radius: 10px;
  padding: 2px 8px; color: var(--muted); font-family: var(--px); }
.pill.hi { border-color: var(--plasma); color: var(--plasma); }

/* ── CARDS ── */
.card { background: var(--plate); border: 1px solid var(--seam);
  border-radius: 8px; padding: 14px; margin: 10px 0; }
.card h3 { font-family: var(--px); font-size: 9px; color: var(--soft);
  letter-spacing: 1px; margin-bottom: 10px; }
.card.glow { box-shadow: 0 0 0 1px var(--plasma), 0 0 24px rgba(124,107,239,.15); }

/* ── BUTTONS ── */
.btn { font-family: var(--ui); font-size: 14px; font-weight: 600;
  border-radius: 6px; border: none; cursor: pointer; padding: 10px 16px;

.btn:active { transform: scale(.96); }
.btn-pr { background: var(--plasma); color: #fff; }
.btn-tr { background: var(--thrust); color: #0a0812; }
.btn-gr { background: transparent; border: 1px solid var(--seam); color: var(--soft); }
.btn-dm { background: rgba(232,79,90,.15); border: 1px solid var(--dmg); color: var(--dmg); }

/* ── INPUTS ── */
input, select, textarea { font-family: var(--ui); font-size: 14px; color: var(--ink);
  background: var(--hull); border: 1px solid var(--seam); border-radius: 6px;

input:focus, select:focus, textarea:focus { outline: 2px solid var(--plasma); }

/* ── TABS ── */

/* ── EVENT TEXT ── */

/* ── GUIDE BOX ── */

.crew-card { display: flex; gap: 10px; align-items: flex-start;

.crew-card .info { flex: 1; min-width: 0; }

.stat b { display: block; color: var(--ink); font-size: 14px; font-weight: 700; }

/* ── VOTE AREA ── */
.vote-box { border: 1px solid var(--plasma); border-radius: 8px;

.vote-box .votes { display: flex; gap: 8px; font-size: 12px; color: var(--soft); margin: 8px 0; }

/* ── ENEMY CARD ── */
.enemy-card { border: 1px solid rgba(232,79,90,.3); border-radius: 8px;
  padding: 10px; background: rgba(232,79,90,.06); margin: 6px 0;

.enemy-card .ep { width: 50px; height: 50px; border-radius: 6px; object-fit: cover;
  background: var(--hull); flex-shrink: 0; }
.enemy-card .info { flex: 1; }
.enemy-card .name { font-weight: 700; font-size: 14px; color: var(--dmg); }

/* ── MAP GRID ── */
.map-grid { display: grid; grid-template-columns: repeat(12,1fr);
  gap: 1.5px; background: #000; border-radius: 6px; padding: 2px;

.mcell { aspect-ratio: 1; font-size: clamp(7px,2vw,11px);

.mc-e { background: #e8e4de; color: #222; }
.mc-hash { background: #050404; }

.mc-b { background: #4a96b0; color: #111; }

.mc-y { background: #c8b420; color: #111; }
.mc-r { background: #9a3030; color: #eee; }
.mc-me { outline: 3px solid #fff; outline-offset: -2px; z-index: 2; position: relative; }
.mc-adj { box-shadow: inset 0 0 0 2px var(--thrust); cursor: pointer; }
.mc-red { color: #e05050; font-weight: 700; }

/* ── SHIP STATUS BAR ── */
.ship-stat { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.ship-stat label { font-size: 11px; color: var(--soft); width: 52px; flex-shrink: 0; }
.ship-stat .sbar { flex: 1; height: 7px; background: var(--seam); border-radius: 4px; overflow: hidden; }
.ship-stat .sbar i { display: block; height: 100%; transition: width .4s; }

/* ── ITEM THROW ── */
.throw-card { border: 1px solid var(--warn); border-radius: 6px; padding: 10px;
  background: rgba(240,165,53,.07); margin: 4px 0; display: flex; align-items: center; gap: 8px; }
.throw-card .itname { flex: 1; font-size: 13px; }

/* ── SEND/RECEIVE TOAST ── */
.inbox { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%;
  transform: translateX(-50%); z-index: 99; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.inbox-item { background: var(--plate); border: 1px solid var(--thrust);
  border-radius: 8px; padding: 10px 14px; font-size: 13px; max-width: 320px;
  box-shadow: 0 4px 24px rgba(0,0,0,.5); animation: slidein .25s ease; }
@keyframes slidein { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:none } }

/* ── TOAST ── */
.toast-wrap { position: fixed; top: calc(56px + env(safe-area-inset-top)); left: 50%;
  transform: translateX(-50%); z-index: 98; }
.toast { background: var(--plate); border: 1px solid var(--seam); border-radius: 6px;
  padding: 8px 14px; font-size: 13px; opacity: 0; transition: opacity .2s; white-space: nowrap; }
.toast.show { opacity: 1; }

/* ── BADGE ── */
.badge { display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; }
.badge-plasma { background: rgba(124,107,239,.2); color: var(--plasma); border: 1px solid var(--plasma); }
.badge-warn { background: rgba(240,165,53,.15); color: var(--warn); border: 1px solid var(--warn); }
.badge-ok { background: rgba(76,204,132,.15); color: var(--safe); border: 1px solid var(--safe); }

/* ── SPIN ── */
.spin { display: inline-block; width: 16px; height: 16px;

/* ── SPLASH ── */

<!-- Main game script — loaded after Firebase is ready -->
<script type="module">
(async () => {
// Wait for Firebase
await new Promise(r => window._SK ? r() : window.addEventListener('fb-ready', r));

// ─── LAZY DATA LOADER ─────────────────────────────────────────────────────────
const DATA_BASE = './data/';
async function loadGz(name) {
  const r = await fetch(DATA_BASE + name);
  const ds = new DecompressionStream('gzip');
  const stream = r.body.pipeThrough(ds);
  const reader = stream.getReader();
  const chunks = [];
  while (true) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); }
  const text = new TextDecoder().decode(await new Blob(chunks).arrayBuffer());
  return JSON.parse(text);
}
const CORE = await fetch(DATA_BASE + 'core.json').then(r => r.json());
const { CGM, ENEMIES, CREW, SHIPS, FLIGHT, GEAR, EVT_META, TT } = CORE;

let EVT = null, MAPS = null, IMG = {};
// Lazy load big data when needed
async function ensureEvt() { if (!EVT) { EVT = await loadGz('events.json.gz'); } }
async function ensureMaps() { if (!MAPS) { MAPS = await loadGz('maps.json.gz'); } }
async function ensureImgs() {
  if (!Object.keys(IMG).length) {
    const raw = await loadGz('imgs.json.gz');
    Object.assign(IMG, raw);
  }
}

// ─── FIREBASE REFS ─────────────────────────────────────────────────────────────
const { db, doc, collection, setDoc, getDoc, updateDoc, onSnapshot, deleteDoc } = window._SK;
function gameDoc(code) { return doc(db, 'games', code); }
function playerDoc(code, pid) { return doc(db, 'games', code, 'players', pid); }
function inboxDoc(code, pid) { return doc(db, 'games', code, 'inbox', pid); }

// ─── UTILS ────────────────────────────────────────────────────────────────────
const R = n => 1 + Math.floor(Math.random() * n);
const d6 = () => R(6);
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
let _tid; function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  clearTimeout(_tid); _tid = setTimeout(() => t.classList.remove('show'), 2400);
}

// ─── STATE ─────────────────────────────────────────────────────────────────────
let mode = 'lobby';       // lobby | gm | player
let roomCode = null;
let playerId = null;      // unique ID for this browser session
let playerName = '';
let G = null;             // game state (full, only GM writes)
let P = null;             // this player's private state
let unsubs = [];          // firebase unsubscribers
let spaceAnim = null;     // requestAnimationFrame handle

function getOrMakePlayerId() {
  let id = sessionStorage.getItem('sk_pid');
  if (!id) { id = 'p' + Math.random().toString(36).slice(2, 9); sessionStorage.setItem('sk_pid', id); }
  return id;
}

// ─── RENDER ROOT ──────────────────────────────────────────────────────────────
const root = document.getElementById('root');
function renderRoot() {
  if (mode === 'lobby') return renderLobby();
  if (mode === 'gm') return renderGM();
  if (mode === 'player') return renderPlayer();
}

// ═══════════════════════════════════════════════════════════
// LOBBY
// ═══════════════════════════════════════════════════════════
function renderLobby() {
  const last = localStorage.getItem('sk_room') || '';
  root.innerHTML = `
<div class="topbar">
  <div class="logo">SPACE<span>KRAKEN</span></div>
</div>
<div class="screen"><div class="wrap">
<div style="text-align:center;padding:24px 0 12px">
  <div style="font-family:var(--px);font-size:10px;color:var(--soft)">// MISSION CONSOLE v2</div>
  <h1 style="font-size:28px;font-weight:700;margin:8px 0 4px">เลือกโหมด</h1>
  <p style="color:var(--soft);font-size:13px">GM เปิดบนแท็บเล็ตกลางโต๊ะ · ผู้เล่นเปิดบนมือถือตัวเอง</p>
</div>

<div class="card glow">
  <h3>🛸 GM MODE — ควบคุมการเล่น</h3>
  <div class="field"><label>ชื่อห้อง / รหัส</label>
    <input id="gm-code" placeholder="ปล่อยว่างเพื่อสร้างใหม่" value="${esc(last)}" style="text-transform:uppercase"></div>
  <div class="field"><label>ความยาก</label>
    <select id="gm-diff"><option value="sim">Just a Simulation</option><option value="adv">Adventurer</option><option value="real">Real Life</option><option value="hard">Hardcore</option></select></div>
  <div class="field"><label>Story Line Set (1–49, ว่าง=สุ่ม)</label>
    <input id="gm-set" type="number" min="1" max="49" placeholder="สุ่มอัตโนมัติ"></div>
  <button class="btn btn-pr" id="gm-start" style="width:100%">🎮 เริ่มเป็น GM</button>
</div>

<div class="card">
  <h3>👾 PLAYER MODE — เล่นเป็นผู้เล่น</h3>
  <div class="field"><label>รหัสห้อง (รับจาก GM)</label>
    <input id="p-code" placeholder="เช่น KR7QX" maxlength="6" style="text-transform:uppercase"></div>
  <div class="field"><label>ชื่อของคุณ</label>
    <input id="p-name" placeholder="ชื่อในเกม"></div>
  <button class="btn btn-tr" id="p-join" style="width:100%">🚀 เข้าร่วมเกม</button>
</div>

${last ? `<div class="card" style="text-align:center">
  <button class="btn btn-gr" id="resume">↺ กลับห้อง ${esc(last)}</button>
</div>` : ''}
</div></div>`;

  document.getElementById('gm-start').onclick = startGM;
  document.getElementById('p-join').onclick = joinPlayer;
  if (last) document.getElementById('resume').onclick = () => { document.getElementById('gm-code').value = last; startGM(); };
}

// ─── GM START ─────────────────────────────────────────────────────────────────
function genCode() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:5}, () => A[Math.floor(Math.random()*A.length)]).join('');
}
function storySet(n) {
  const ROW=[["1HH","1NA","1EZ","1CD","1NH","1NU","1NC"],["1PT","1FU","1NF","1SA","1JU","1VX","1NG"],["1RX","1NB","1PQ","1FF","1CW","1XE","1LL"],["1JS","1AW","1NP","1BU","1NE","1EV","1PR"]];
  const i=(n-1)%7, b=Math.floor((n-1)/7);
  return ROW.map((r,k) => r[(i+k*b)%7]);
}

async function startGM() {
  const codeInput = document.getElementById('gm-code').value.trim().toUpperCase();
  const code = codeInput || genCode();
  const diff = document.getElementById('gm-diff').value;
  const setN = parseInt(document.getElementById('gm-set').value) || R(49);

  roomCode = code;
  mode = 'gm';
  localStorage.setItem('sk_room', code);

  // Check if room exists
  const snap = await getDoc(gameDoc(code));
  if (snap.exists()) {
    G = snap.data();
  } else {
    G = makeInitialState({ code, diff, setN });
    await setDoc(gameDoc(code), G);
  }

  subscribeGM();
  renderRoot();
  toast('ห้อง ' + code + ' พร้อมแล้ว 🎮');
}

function makeInitialState({ code, diff, setN }) {
  return {
    code, diff, setN, turn: 1, phase: 'setup',
    credits: 100, xp: 0, o2: 25, o2Max: 25,
    ship: null, cargo: [],
    lines: storySet(setN).map(pos => ({ pos, vars: {}, ended: false })).concat([null, null]),
    inter: {},
    locs: [],
    log: [{ m: 'เริ่มภารกิจ Story Set ' + setN, k: 'ok', t: Date.now() }],
    players: {},
    activeEvent: null,
    votes: {},
    cmb: null, dun: null, sp: null, loot: null,
    lineSkip: -1,
    rec: false,
    skipUsed: false,
  };
}

// ─── PLAYER JOIN ──────────────────────────────────────────────────────────────
async function joinPlayer() {
  const code = document.getElementById('p-code').value.trim().toUpperCase();
  const name = document.getElementById('p-name').value.trim();
  if (!code || !name) { toast('กรอกรหัสห้องและชื่อด้วยครับ'); return; }

  const snap = await getDoc(gameDoc(code));
  if (!snap.exists()) { toast('ไม่พบห้อง ' + code); return; }

  roomCode = code;
  playerId = getOrMakePlayerId();
  playerName = name;
  mode = 'player';
  G = snap.data();

  // Register player
  P = { id: playerId, name, hp: 0, hpMax: 0, crew: null, inv: {}, tab: 'char', role: null };
  await setDoc(playerDoc(code, playerId), { name, id: playerId, online: true, joinedAt: Date.now() });

  subscribePlayer();
  renderRoot();
  toast('ยินดีต้อนรับ ' + name + '! 🚀');
}

// ─── FIREBASE SUBSCRIPTIONS ───────────────────────────────────────────────────
function subscribeGM() {
  unsubs.forEach(u => u());
  unsubs = [
    onSnapshot(gameDoc(roomCode), snap => { if (snap.exists()) { G = snap.data(); if (mode === 'gm') renderGM(); } })
  ];
}

function subscribePlayer() {
  unsubs.forEach(u => u());
  unsubs = [
    onSnapshot(gameDoc(roomCode), snap => { if (snap.exists()) { G = snap.data(); if (mode === 'player') renderPlayer(); } }),
    onSnapshot(playerDoc(roomCode, playerId), snap => { if (snap.exists()) { const d = snap.data(); if (d.crew && (!P.crew || P.crew.id !== d.crew.id)) { P.crew = d.crew; P.hp = d.hp ?? d.crew?.max ?? 8; P.hpMax = d.hpMax ?? d.crew?.max ?? 8; P.inv = d.inv ?? {}; } if (mode === 'player') renderPlayer(); } }),
    onSnapshot(inboxDoc(roomCode, playerId), snap => {
      if (snap.exists()) {
        const items = snap.data().items || [];
        if (items.length) showInbox(items);
      }
    })
  ];
}

// ─── FIREBASE WRITE HELPERS ───────────────────────────────────────────────────
async function gUpdate(data) {
  if (!roomCode) return;
  await updateDoc(gameDoc(roomCode), data).catch(e => toast('ซิงก์ผิดพลาด'));
}
async function gSet(data) {
  if (!roomCode) return;
  G = { ...G, ...data };
  await setDoc(gameDoc(roomCode), G);
}
async function pushLog(m, k = '') {
  const entry = { m, k, t: Date.now() };
  G.log = [...(G.log || []).slice(-59), entry];
  return entry;
}

function renderMapGrid(g, D) {
  let h = '';
  for (let r = 0; r < 12; r++) for (let c = 0; c < 12; c++) {

    const me = r === D.r && c === D.c;
    const adj = Math.abs(r-D.r)+Math.abs(c-D.c) === 1 && walkable(ci);
    const done = (D.done||{})[r+'_'+c];
    h += `<div class="mcell mc-${ci.bg} ${ci.red?'mc-red':''} ${me?'mc-me':''} ${adj?'mc-adj':''} ${done?'mc-done':''}" ${adj?`data-mv="${r},${c}"`:''}>
      ${me ? '🧑‍🚀' : esc(ci.lab)}</div>`;
  }
  return h;
}

  </div>

// ── GM WIRE ───────────────────────────────────────────────
function wireGM() {
  // Resource bumps
  document.querySelectorAll('[data-res]').forEach(b => b.onclick = () => bumpRes(b.dataset.res, parseInt(b.dataset.d)));
  // Run line
  document.querySelectorAll('[data-run]').forEach(b => b.onclick = () => runLineGM(parseInt(b.dataset.run)));
  document.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => skipLine(parseInt(b.dataset.skip)));
  // Event
  document.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => resolveEvent(b.dataset.ev));
  document.querySelectorAll('[data-standby]').forEach(b => b.onclick = () => standbyEvent());
  // Actions
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => gmAct(b.dataset.act));
  // Map move
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { const [r,c] = b.dataset.mv.split(','); gmMove(+r,+c); });
  // Flight
  document.querySelectorAll('[data-fdif]').forEach(b => b.onclick = () => { if(!G.fl) G.fl={dif:2,opt:{}}; G.fl.dif=+b.dataset.fdif; renderGM(); });
  document.querySelectorAll('[data-fopt]').forEach(b => b.onclick = () => { if(!G.fl) G.fl={dif:2,opt:{}}; G.fl.opt[b.dataset.fopt]=!G.fl.opt[b.dataset.fopt]; renderGM(); });
  // Loc gen
  document.querySelectorAll('[data-lgm]').forEach(b => b.onclick = () => adjLoc(b.dataset.lgm, b.dataset.lv));
  // Loot
  document.querySelectorAll('[data-lb]').forEach(b => b.onclick = () => lootBonus(b.dataset.lb));
  document.querySelector('[data-act="lroll"]')?.click; // handled in act
  document.querySelectorAll('[data-lpick]').forEach(b => b.onclick = () => lootPick(+b.dataset.lpick));
  // Combat fxcmb
  document.querySelectorAll('[data-fxcmb]').forEach(b => b.onclick = () => startCombat(+b.dataset.fxcmb, 'Insectoids', false, false, !!G.dun));
  document.querySelectorAll('[data-fxshop]').forEach(b => b.onclick = () => openShop(2, false));
  document.querySelectorAll('[data-sendcargo]').forEach(b => b.onclick = () => promptSendCargo(+b.dataset.sendcargo));
  document.querySelectorAll('[data-land]').forEach(b => b.onclick = async () => { await ensureMaps(); enterMap(+b.dataset.land, 1); });
  document.getElementById('gm-goto-p1')?.addEventListener('click', async () => {
    await recover();
    await gSet({ phase: 'p1', players: G.players || {} });
    pushLog('เริ่มเทิร์น 1', 'ok');
  });
  document.getElementById('p1-done')?.addEventListener('click', () => { G.skipUsed = false; gSet({ phase: 'p3', lines: G.lines }); });
}

async function bumpRes(f, d) {
  const v = Math.max(0, (G[f]||0) + d);
  await gUpdate({ [f]: v });
}

// ═══════════════════════════════════════════════════════════
// GM GAME LOGIC (CGM ENGINE)
// ═══════════════════════════════════════════════════════════
function cell(co) { if (!co||co.length<3) return null; const r=(CGM[co[0]]||{})[co.slice(1)]; return r?{k:r[0],v:r.slice(1)}:null; }
const shift = (co,n) => co[0]+String.fromCharCode(co.charCodeAt(1)+n)+co[2];
function gv(l,t){ return /^-?\d+$/.test(t)?+t:('ABCDEFGH'.includes(t)?l.vars[t]:G.inter[t])||0; }
function sv(l,t,v){ if('ABCDEFGH'.includes(t))l.vars[t]=v; else G.inter[t]=v; }

async function runLineGM(i) {
  const l = G.lines[i];
  let hop = 0;
  while (hop++ < 90) {
    const c = cell(l.pos);
    if (!c) { pushLog('L'+(i+1)+': ไม่พบ '+l.pos, 'x'); l.done = 1; break; }
    if (c.v === '/') { pushLog('L'+(i+1)+': เส้นเรื่องจบ', 'ok'); G.lines[i] = null; break; }
    if (/^\d[A-Z]{2}$/.test(c.v)) {
      if (c.k === 'R') { l.pos = c.v; l.done = 1; pushLog('L'+(i+1)+' หยุดที่ '+c.v); break; }
      l.pos = c.v; continue;
    }
    if (c.v[0] === '!') {
      const id = c.v.slice(1);
      await ensureEvt();
      const text = EVT[id] || '(ไม่พบข้อความ)';
      const choice = EVT_META[id]?.c === 1;
      G.activeEvent = { line: i, id, at: l.pos, text, choice };
      G.votes = {};
      G.phase = 'event';
      pushLog('Event '+id+' (L'+(i+1)+')', 'k');
      await gSet({ lines: G.lines, inter: G.inter, activeEvent: G.activeEvent, votes: {}, phase: 'event', log: G.log });
      return;
    }
    if (c.v[0] === '%') { const n=+c.v.slice(1),r=Math.ceil(Math.random()*20); pushLog('สุ่ม d20='+r+' vs '+n,'k'); l.pos=shift(l.pos,r>=n?1:2); continue; }
    const m = c.v.match(/^([A-Z]|\d+)([+\-<>=])([A-Z]|\d+)$/);
    if (m) {
      const a=gv(l,m[1]),b=gv(l,m[3]);
      if(m[2]==='+'||m[2]==='-'){sv(l,m[1],a+(m[2]==='+'?b:-b));l.pos=shift(l.pos,1);}
      else{l.pos=shift(l.pos,(m[2]==='>'?a>b:m[2]==='<'?a<b:a===b)?1:2);}
      continue;
    }
    pushLog('ช่องไม่รู้จัก: '+c.v,'x'); l.done=1; break;
  }
  await gSet({ lines: G.lines, inter: G.inter, log: G.log });
}

async function skipLine(i) {
  if (G.skipUsed) { toast('ข้ามได้แค่ 1 ไลน์ต่อเทิร์น'); return; }
  G.lines[i].done = 1;
  G.skipUsed = true;
  G.lineSkip = i;
  await gSet({ lines: G.lines, skipUsed: true, lineSkip: i });
}

async function resolveEvent(choice) {
  const e = G.activeEvent;
  if (!e) return;
  const l = G.lines[e.line];
  if (l) { l.pos = shift(e.at, choice === 'B' ? 2 : 1); }
  G.activeEvent = null; G.votes = {};
  G.phase = 'p1';
  pushLog('เลือก '+choice, 'k');
  await gSet({ lines: G.lines, activeEvent: null, votes: {}, phase: 'p1', log: G.log });
  if (l) runLineGM(e.line);
}

async function standbyEvent() {
  const e = G.activeEvent;
  if (!e) return;
  const l = G.lines[e.line];
  if (l) { l.standby = 1; l.done = 1; }
  G.activeEvent = null; G.phase = 'p1';
  await gSet({ lines: G.lines, activeEvent: null, phase: 'p1' });
}

// ─── LOCATION GEN ─────────────────────────────────────────
const TYPES = ['Space Station','Overland','Underground','Mining Station','In Space','Core Planet'];
const SPECIES = ['Kraken','Grey','Insectoids','Lost','Beasts','Renegades'];

function locFrom(r, dif) {
  const t = TYPES[r.type-1] || TYPES[0];
  let ao = r.ao<=2?'YES':r.ao<=4?'NO':'HELL';
  const ai = r.ai<=2?'YES':r.ai<=5?'NO':'HELL';
  if ((t==='Space Station'||t==='In Space')&&ao==='YES') ao='NO';
  return { type:t, dif, ao, ai, depth:3+r.depth, tele:Math.ceil(r.tele/2), special:r.special<=4?'-':r.special===5?'One-way':'Self-destruct', species:SPECIES[r.species-1]||'Insectoids', maps:Array.from({length:3+r.depth},()=>Math.ceil(Math.random()*20)), cleared:[] };
}

async function adjLoc(key, lv) {
  const g = G.lg;
  if (!g) return;
  g.mods--;
  const max = { depth:6 }[key] || 6;
  g.r[key] = lv==='r' ? Math.ceil(Math.random()*6) : Math.max(1,Math.min(max,(g.r[key]||1)+ +lv));
  await gSet({ lg: g });
}

async function gmAct(a) {
  switch (a) {
    case 'goflight': await gSet({ phase:'flight', fl:{dif:2,opt:{}} }); break;
    case 'fly': await startFlight(); break;
    case 'p3back': await gSet({ phase:'p3' }); break;
    case 'spround': spaceRound(false); break;
    case 'spesc': spaceRound(true); break;
    case 'lgsave': {
      await ensureMaps();
      const L = locFrom(G.lg.r, G.lg.dif);
      const cap = 2; G.locs = [...(G.locs||[]).slice(-cap+1), L];
      if (!G.lg.noLand) { await enterMap(G.locs.length-1, 1); break; }
      await gSet({ locs: G.locs, lg: null, phase:'p3', log: G.log });
      break;
    }
    case 'endturn': await endTurn(); break;
    case 'endround': endRound(); break;
    case 'dunact': { const D=G.dun; if(D) trigger(D.r, D.c, false); break; }
    case 'g5shop': openShop(5, false); break;
    case 'leaveshop': await gSet({ phase: G.shop?.back||'p3', shop:null }); break;
    case 'lroll': lootRoll(); break;
    case 'lnext': lootNext(); break;
    case 'fxloot': { G.pendingLoot = [...(G.pendingLoot||[]),{g: G.dun ? G.dun.dif+1 : 2}]; startLoot(); break; }
    case 'fxshop': openShop(2, false); break;
  }
}

async function startFlight() {
  const f = G.fl || {dif:2,opt:{}};
  let fd = f.dif + (f.opt.risky?1:0) + (f.opt.danger?2:0) - (f.opt.pay?1:0);
  if (f.opt.pay) G.credits = Math.max(0, G.credits - 5);
  if (f.opt.safe || fd <= 0) { pushLog('บินอย่างปลอดภัย','ok'); genLoc(); return; }
  const r = d6();
  if (r >= fd) { pushLog('หลบสำเร็จ d6='+r,'ok'); genLoc(); return; }
  let no = Math.min(19, Math.max(3, fd*2 + Math.ceil(d6()/2)));
  const F = FLIGHT[no];
  const sh = shipSh();
  G.sp = { no, name:F.name, tl:F.tl, t:0, ob:[...F.ob], en:F.en.map(e=>({...e,csh:e.sh,hp:e.sp})), sp:shipSP(), sh:sh.c, ammo:[] };
  pushLog('Space Combat #'+no+' '+F.name+'!', 'x');
  await gSet({ phase:'space', sp:G.sp, credits:G.credits, log:G.log });
}

function genLoc() {
  const r = { type:d6(),ao:d6(),ai:d6(),depth:d6(),tele:d6(),special:d6(),species:d6() };
  G.lg = { dif: (G.fl||{}).dif||2, mods:3+(G.fl?.opt?.risky?0:G.fl?.opt?.danger?-1:1), noLand:!!(G.fl?.opt?.safe), r };
  gSet({ phase:'locgen', lg:G.lg, fl:null, credits:G.credits, log:G.log });
}

function spaceRound(escape) {
  const s = G.sp;
  const tl = s.tl[s.t]||'.';
  s.t++;
  const enemyFire = () => {
    s.en.filter(e=>e.hp>0).forEach(e=>{
      const r=d6(); if(r<4){pushLog(e.n+' ยิงพลาด');return;}
      let dm=e.dmg+(r===6?3:0);
      const ab=Math.min(s.sh,dm); s.sh-=ab; dm-=ab; dm=Math.max(0,dm-shipArmor());
      s.sp-=dm; pushLog(e.n+' โดนยาน -'+dm,'x');
    });
  };
  if (tl==='B') s.en.forEach(e=>{if(e.hp<=0){e.hp=e.sp;e.csh=e.sh;}});
  if (escape) {
    const r=Math.ceil(Math.random()*20)+5;
    if(r>=20){pushLog('หนีรอด!','ok');G.sp=null;genLoc();return;}
    pushLog('หนีไม่ได้ ('+r+')','.x');
  } else {
    s.en.filter(e=>e.hp>0).forEach(e=>{
      const r=d6(); if(r<4){pushLog('ยิงพลาด '+e.n);return;}
      let dm=3+(r===6?2:0); e.hp-=dm;
      pushLog('ยิง '+e.n+' -'+dm+(e.hp<=0?' 💥':''),e.hp<=0?'ok':'');
    });
    enemyFire();
  }
  const win = s.en.every(e=>e.hp<=0)||tl==='V';
  if(s.sp<=0){G.sp=null;G.phase='over';G.overMsg='ยานถูกทำลาย';gSet({phase:'over',sp:null,overMsg:G.overMsg,log:G.log});return;}
  if(win){const x=FLIGHT[s.no]?.xp||10;G.xp+=x;G.credits+=x;pushLog('ชนะ Space Combat +'+x,'ok');G.sp=null;genLoc();return;}
  if(tl==='G'){G.sp=null;G.phase='over';G.overMsg='ยานระเบิด';await gSet({phase:'over',sp:null,overMsg:G.overMsg,log:G.log});return;}
  const shr=shipSh().r; s.sh=Math.min(shipSh().c,s.sh+shr);
  gSet({ sp:s, xp:G.xp, credits:G.credits, log:G.log });
}

async function enterMap(loc, no) {
  const L = G.locs[loc];
  if (!MAPS) return;
  const g = (MAPS[L.type]||{})[L.maps[no-1]];
  let pos = [5,1];
  if (g) for(let r=0;r<12&&pos[0]===5;r++) for(let c=0;c<12;c++){const f=feature(cellInfo(g,r,c));if(f?.t==='in'){pos=[r,c];break;}}
  G.dun = { loc, no, r:pos[0], c:pos[1], done:{}, bh:{}, q:{}, dif:L.dif, back:false };
  G.phase = 'dun';
  pushLog('เข้า '+L.type+' แผนที่ '+no, 'k');
  await gSet({ dun:G.dun, phase:'dun', log:G.log });
}

function cellInfo(g,r,c){if(!g||r<0||r>11||c<0||c>11)return{bg:'hash',lab:'',red:false};const s=g[r][c];const[bg,rest]=s.split('|');let red=false,lab=rest||'';if(lab.endsWith('*')){red=true;lab=lab.slice(0,-1)}return{bg:bg[0],lab,red};}
function walkable(ci){return ci&&ci.bg!=='.'&&ci.bg!=='#'}
function feature(ci){if(!ci||!ci.lab)return null;const l=ci.lab;if(l==='>') return{t:'in'};if(/^EX/.test(l))return{t:'ex'};if(l==='/')return{t:'out'};if(/^E\d?$/.test(l)||l==='E?')return{t:'en',n:+(l[1]||0)};if(/^B\d?$/.test(l)||l==='B?')return ci.red?{t:'boss',n:+(l[1]||0)}:{t:'bh',n:+(l[1]||0)};if(/^T\d?/.test(l))return{t:'tr',n:+(l[1]||0)};if(/^S\d?/.test(l))return{t:'shop',n:+(l[1]||0)};if(l==='+')return{t:'med'};if(/^O/.test(l)||l==='0')return{t:'o2'};return{t:'?'};}

function trigger(r, c, entering) {
  const D = G.dun, L = G.locs[D.loc];
  const g = (MAPS[L.type]||{})[L.maps[D.no-1]];
  const ci = cellInfo(g, r, c);
  const f = feature(ci);
  D.r = r; D.c = c;
  if (!f) { gSet({ dun:G.dun }); return; }
  const k = r+'_'+c;
  switch(f.t) {
    case 'tr': if (!D.done[k]) { D.done[k]=1; G.pendingLoot=[...G.pendingLoot||[],{g:Math.min(6,L.dif+1)}]; startLoot(); return; }break;
    case 'en': case 'boss': if(!D.done[k]){D.done[k]=1;D.lastCell=k;startCombat(L.dif+(+f.n||0),L.species,f.t==='boss',false,true);return;}break;
    case 'shop': openShop(L.dif+1,true);return;
    case 'med': if(!D.med){D.med=1;pushLog('Med station +4 HP','ok');healAll(4);}break;
    case 'o2': if(!D.o2d){D.o2d=1;G.o2=G.o2Max;pushLog('O₂ เต็ม','ok');}break;
    case 'ex': nextMap();return;
  }
  gSet({ dun:G.dun, o2:G.o2, log:G.log });
}

async function gmMove(r, c) {
  await ensureMaps();
  trigger(r, c, true);
}

function nextMap() {
  const D=G.dun, L=G.locs[D.loc];
  if(!L.cleared.includes(D.no))L.cleared.push(D.no);
  if(D.no>=L.depth){L.solved=1;const x=L.depth*L.dif*2;G.xp+=x;pushLog('พิชิต! +'+x,'ok');G.pendingLoot=[1,2,3,4].map(()=>({g:L.dif+1}));G.afterLoot='leave';startLoot();return;}
  enterMap(D.loc,D.no+1);
}

// ─── COMBAT ───────────────────────────────────────────────
const SPMAP={Kraken:'Kraken',Grey:'Grey',Insectoids:'Insectoid',Lost:'Lost',Beasts:'Beasts',Renegades:'Renegades'};
function pickEnemy(sp,lv){lv=Math.max(1,Math.min(6,lv));const pool=ENEMIES.filter(e=>e.sp===SPMAP[sp]&&e.lv===lv);return pool.length?pool[Math.floor(Math.random()*pool.length)]:ENEMIES[0];}
function mkEnemy(e,lv){return{id:'e'+Math.random().toString(36).slice(2,6),n:e.name,base:e.name,sp:e.sp,lv:e.lv,ag:+e.ag||1,ar:+e.ar||0,wk:(e.wk||'-').split(/,\s*/),rs:(e.rs||'-').split(/,\s*/),xp:+e.xp||1,tr:+e.tr||1,act:e.act,sp2:e.sp2||'',hp:e.hp||5,max:e.hp||5,sh:e.sh||0,csh:e.sh||0,gone:false};}

function startCombat(lv, sp, boss, amb, fromDun) {
  const prim = pickEnemy(sp, Math.min(6,lv));
  const C = { en:[mkEnemy(prim,lv)], round:1, boss, amb, xp:0, fromDun, lv, escTries:0, acted:{} };
  if(lv>1&&d6()>=4) C.en.push(mkEnemy(pickEnemy(sp,Math.max(1,lv-1)),lv-1));
  G.cmb = C; G.phase = 'cmb';
  pushLog((boss?'👹 BOSS: ':'⚔️ ')+(C.en.map(e=>e.n).join(', ')), 'x');
  gSet({ cmb:G.cmb, phase:'cmb', log:G.log });
}

async function endRound() {
  const C = G.cmb;
  // Enemy turn
  C.en.forEach(e => {
    if (e.hp <= 0 || e.gone) return;
    const r = d6();
    const row = e.act.find(a => { const m=a[0].match(/(\d)(?:-(\d))?/); return r>=+m[1]&&r<=+(m[2]||m[1]); });
    if (!row) return;
    const m = row[1].match(/(ML|RG)\s*(\d)\+,\s*(\d+)/);
    if (m) {
      const need=+m[2], dmg=+m[3];
      const roll=d6(); if(roll<need){pushLog(e.n+': ยิงพลาด');return;}
      const players = Object.values(G.players||{}).filter(p=>p.crew);
      if(!players.length)return;
      const tgt = players[Math.floor(Math.random()*players.length)];
      const got = Math.max(0, dmg-2); // 2 = armor estimate
      tgt.hp = Math.max(-4, (tgt.hp||0) - got);
      pushLog(e.n+' โจมตี '+tgt.name+' -'+got+' HP', 'x');
    }
  });
  C.round++;
  C.acted = {};
  // Check win/lose
  if (C.en.every(e=>e.hp<=0||e.gone)) {
    let xp=0; C.en.forEach(e=>{xp+=e.xp;G.pendingLoot=[...G.pendingLoot||[],{g:e.tr||1}]});
    if(C.boss)xp*=2; G.xp+=xp;
    pushLog('ชนะ! +'+xp+' XP','ok');
    G.cmb=null;
    if(G.pendingLoot?.length) startLoot(); else { G.phase=G.dun?'dun':'p3'; await gSet({phase:G.phase,cmb:null,xp:G.xp,players:G.players,log:G.log}); }
    return;
  }
  await gSet({ cmb:C, players:G.players, log:G.log });
}

function lootBonus(c) { if(c==='cr')G.credits+=G.loot.g; else{const st=clone(GEAR.I.find(i=>/Stimpack/.test(i.n)));if(st){G.cargo=[...G.cargo,parseItem(st.n,st.e,st.g)]}}G.loot.phase='roll'; gSet({loot:G.loot,credits:G.credits,cargo:G.cargo}); }
function lootRoll() { const L=G.loot,loc=G.dun?G.locs[G.dun.loc].type:'Space Station';const r=Math.ceil(Math.random()*20);const k=TT[loc]?.[r-1]||'N';pushLog('Treasure d20='+r+' → '+k,'k');if(k==='N'){L.phase='done';L.msg='ว่างเปล่า...';}else if(k==='C'){const x=Math.floor(PRICE[L.g]/2);G.credits+=x;L.phase='done';L.msg='ได้เงิน '+x+'¢';}else if(k==='W'||k==='I'){const dd=d6();L.opts=(k==='W'?weaponList:itemList).filter(x=>x.g===L.g&&x.d6===dd).map(x=>({...x}));L.phase='pick';L.msg='d6='+dd+' เลือก 1';}else{L.phase='done';L.msg='รายการอื่น...';}gSet({loot:L,credits:G.credits}); }
function lootPick(i) { const it=G.loot.opts[i];G.cargo=[...G.cargo,it];G.loot.phase='done';G.loot.msg='ได้ '+it.n+' → คลังยาน';gSet({loot:G.loot,cargo:G.cargo}); }
function lootNext() { if(G.pendingLoot?.length){startLoot();return;}G.loot=null;const back=G.afterLoot||null;G.afterLoot=null;G.phase=G.dun?(back==='leave'?'p3':'dun'):back||'p3';gSet({loot:null,phase:G.phase,afterLoot:null}); }

const PRICE=[0,2,5,12,30,70,150];
function shipSys(n){return(G.ship?.sys||[]).filter(s=>s.n.includes(n));}
function shipSP(){if(!G.ship)return 0;const def=SHIPS.find(s=>s.name===G.ship.name);let sp=+(def?.sys[0]?.d.match(/(\d+) SP/)||[0,20])[1];G.ship.sys.forEach(s=>{if(/Hull expansion/.test(s.n))sp+=8;});return sp;}
function shipSh(){let c=0,r=0;shipSys('Primary').forEach(()=>{c+=5;r+=2});shipSys('Secondary').forEach(()=>{c+=4;r+=2});return{c,r};}
function shipArmor(){return shipSys('Armor').length+2*shipSys('Heavy Armor').length;}

async function promptSendCargo(i) {
  const players = Object.values(G.players||{});
  if (!players.length) { toast('ยังไม่มีผู้เล่น'); return; }
  const name = prompt('ส่งให้ใคร?\n' + players.map((p,j)=>`${j+1}. ${p.name}`).join('\n') + '\n0. ยกเลิก');
  const idx = parseInt(name) - 1;
  if (idx < 0 || idx >= players.length) return;
  const tgt = players[idx];
  const item = G.cargo[i];
  G.cargo.splice(i, 1);
  // Push to inbox
  const iRef = inboxDoc(roomCode, tgt.id);
  const snap = await getDoc(iRef);
  const existing = snap.exists() ? (snap.data().items||[]) : [];
  await setDoc(iRef, { items: [...existing, item] });
  await gSet({ cargo: G.cargo });
  toast('ส่ง '+item.n+' ให้ '+tgt.name);
}

// ═══════════════════════════════════════════════════════════
// PIXEL ART SPACE CANVAS
// ═══════════════════════════════════════════════════════════
let stars = [];
let canvasHandle = null;

function initSpaceCanvas(canvas, phase) {
  if (canvasHandle) { cancelAnimationFrame(canvasHandle); canvasHandle = null; }
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth, H = canvas.offsetHeight || 220;
  canvas.width = W; canvas.height = H;

  // Init starfield
  if (!stars.length) stars = Array.from({length:80}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    s: Math.random()<0.1?2:1,
    spd: 0.3+Math.random()*2.5,
    br: 0.4+Math.random()*0.6
  }));

  // Ship sprite (pixel art, 16x16 grid → drawn with rects)
  const SHIP_PX = [
    '......XX......',
    '.....XXXX.....',
    '....XXXXXX....',
    '...XXXXXXXX...',
    '..XXXXXXXXXX..',
    '.XXXXXXXXXXXX.',
    'XXXXXXXXXXXXXX',
    '.XXXXXXXXXXXX.',
    '..XX.XXXX.XX..',
    '...X.XXXX.X...',
    '....X.XX.X....',
    '...XX.XX.XX...',
    '..XXX.XX.XXX..',
    '.....XXXX.....',
    '....X....X....',
    '...X......X...',
  ];
  const SX = 14, SY = 16, PX = 5;
  const shipW = SX*PX, shipH = SY*PX;

  // Enemy sprite (simple)
  const ENM = [
    '...XXXX...',
    '..XXXXXX..',
    '.XXXXXXXX.',
    'XX..XX..XX',
    'XXXXXXXXXX',
    '.X.XXXX.X.',
    'X........X',
    '.XX....XX.',
  ];
  const EW=10, EH=8, EP=5;

  // Colors
  const C_HULL = '#b0c8e8';
  const C_WING = '#7890c0';
  const C_ENGINE = '#5060a0';
  const C_GLOW = '#46e5c4';
  const C_ENM = '#e84f5a';
  const C_ENM2 = '#ff8080';

  let t = 0;
  let enemies = [
    { x: W*0.75, y: H*0.25, vx:-0.4, vy:0.2 },
    { x: W*0.85, y: H*0.55, vx:-0.3, vy:-0.25 },
  ];

  function drawShip(cx, cy, flicker) {
    const ox = cx - shipW/2, oy = cy - shipH/2;
    // Engine glow (pulse)
    const g = ctx.createRadialGradient(cx, oy+shipH, 0, cx, oy+shipH, 40);
    const gp = 0.5+0.5*Math.sin(t*0.15);
    g.addColorStop(0, `rgba(70,229,196,${0.35+0.3*gp})`);
    g.addColorStop(1, 'rgba(70,229,196,0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx-40, oy+shipH-10, 80, 60);

    SHIP_PX.forEach((row, ry) => {
      [...row].forEach((c, rx) => {
        if (c !== 'X') return;
        const isEngine = ry >= 13;
        const isWing = rx < 3 || rx >= SX-3;
        ctx.fillStyle = flicker && isEngine ? C_GLOW :
          isEngine ? (Math.random() < 0.4 ? C_GLOW : C_ENGINE) :
          isWing ? C_WING : C_HULL;
        ctx.fillRect(ox+rx*PX, oy+ry*PX, PX, PX);
      });
    });
  }

  function drawEnemy(ex, ey, flicker) {
    ENM.forEach((row, ry) => {
      [...row].forEach((c, rx) => {
        if (c !== 'X') return;
        ctx.fillStyle = flicker ? C_ENM2 : C_ENM;
        ctx.fillRect(Math.round(ex)+rx*EP, Math.round(ey)+ry*EP, EP, EP);
      });
    });
  }

  function drawShot(x, y, dir) {
    ctx.fillStyle = '#ffff80';
    ctx.fillRect(x, y, 4, dir==='right'?10:10);
    ctx.fillStyle = '#ffffc0';
    ctx.fillRect(x+1, y+2, 2, 6);
  }

  let shots = [];
  let shotTimer = 0;

  function frame() {
    canvasHandle = requestAnimationFrame(frame);
    t++;

    ctx.fillStyle = '#000014';
    ctx.fillRect(0, 0, W, H);

    // Stars
    stars.forEach(s => {
      s.x -= s.spd * (phase==='space' ? 2.5 : 1.2);
      if (s.x < 0) { s.x = W; s.y = Math.random()*H; }
      ctx.globalAlpha = s.br * (0.7+0.3*Math.sin(t*0.05+s.x));
      ctx.fillStyle = '#fff';
      ctx.fillRect(Math.round(s.x), Math.round(s.y), s.s, s.s);
    });
    ctx.globalAlpha = 1;

    // SPACE COMBAT
    if (phase === 'space') {
      const shipX = W*0.28, shipY = H/2 + 8*Math.sin(t*0.025);
      drawShip(shipX, shipY, t%8<2);

      // Enemy movement
      enemies.forEach((e, ei) => {
        e.x += e.vx; e.y += e.vy;
        if (e.x < W*0.55) e.vx = Math.abs(e.vx);
        if (e.x > W-60) e.vx = -Math.abs(e.vx);
        if (e.y < 20) e.vy = Math.abs(e.vy);
        if (e.y > H-60) e.vy = -Math.abs(e.vy);
        drawEnemy(e.x, e.y, t%12<2 && ei===0);
      });

      // Player shots
      shotTimer++;
      if (shotTimer % 40 === 0) {
        shots.push({ x: shipX+shipW/2, y: shipY, dir:'right' });
      }
      // Enemy shots
      if (shotTimer % 65 === 0 && enemies.length) {
        const e = enemies[0];
        shots.push({ x: e.x, y: e.y+EH*EP/2, dir:'left', enemy:true });
      }

      shots = shots.filter(s => s.x > -10 && s.x < W+10);
      shots.forEach(s => {
        s.x += s.enemy ? -8 : 10;
        const col = s.enemy ? '#e84f5a' : '#ffff44';
        ctx.fillStyle = col;
        ctx.fillRect(Math.round(s.x), Math.round(s.y), s.enemy?8:12, 3);
      });

    } else {
      // FLIGHT — peaceful hyperdrive
      ctx.fillStyle = 'rgba(70,229,196,0.03)';
      for (let i = 0; i < 6; i++) {
        const r = ((t*1.5 + i*60) % 360) * Math.PI/180;
        const rad = 60+i*18;
        ctx.beginPath(); ctx.arc(W/2, H/2, rad, 0, Math.PI*2);
        ctx.stroke();
      }
      const shipX = W*0.45, shipY = H/2 + 6*Math.sin(t*0.02);
      drawShip(shipX, shipY, t%10<3);
    }
  }

  frame();
}

      const it = inv[s];
      return `<div class="throw-card">
        <div style="width:28px;font-size:11px;color:var(--soft)">${s==='L'?'ซ้าย':s==='R'?'ขวา':s}</div>
        <div class="itname">${it ? `<b>${esc(it.n)}</b><div style="font-size:11px;color:var(--soft)">${it.k==='W'?wDesc(it):esc(it.e)}</div>` : '<span style="color:var(--muted)">ว่าง</span>'}</div>
        ${it ? `<button class="btn btn-warn sm" data-send="${s}">📤</button>` : ''}
      </div>`;
    }).join('')}
    ${Object.keys(inv).filter(s=>!sl.includes(s)).map(s=>{
      const it = inv[s];
      return `<div class="throw-card"><div class="itname"><b>${esc(it.n)}</b></div><button class="btn btn-warn sm" data-send="${s}">📤</button></div>`;
    }).join('')}
    <p style="font-size:12px;color:var(--muted);margin-top:8px">📤 = ส่งให้เพื่อน</p>
  </div>`;
}

function renderShopPlayer() {
  if (G?.phase !== 'shop') return `<div class="card"><p style="color:var(--soft)">ร้านค้าปิดอยู่</p></div>`;
  const grade = G.shop?.grade || 2;
  const PRICE=[0,2,5,12,30,70,150];
  return `<div class="card"><h3>🏪 ร้านค้า เกรดไม่เกิน ${grade}</h3>
    <div class="tabs" style="margin-bottom:8px">
      <button class="tab on" id="shop-w-tab">อาวุธ</button>
      <button class="tab" id="shop-i-tab">ไอเทม</button>
    </div>
    <div id="shop-list">
      ${GEAR_W.filter(w=>w.g<=grade).slice(0,20).map((w,i)=>`<div class="throw-card">
        <div class="itname"><b>${esc(w.n)}</b><div style="font-size:11px;color:var(--soft)">${wDesc(w)}</div></div>
        <span style="font-size:12px;color:var(--warn)">${PRICE[w.g]}¢</span>
        <button class="btn btn-tr sm" data-pbuy="W:${GEAR_W.indexOf(w)}">ซื้อ</button>
      </div>`).join('')}
    </div>
  </div>`;
}

function guideBox(title, items) {
  return `<div class="guide"><h4>${title}</h4><ul>${items.map(s=>`<li>${s}</li>`).join('')}</ul></div>`;
}

// ── PLAYER WIRE ────────────────────────────────────────────
function wirePlayer(ph) {
  // Crew pick
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
    const t = CREW[+b.dataset.pick];
    if (P.crew?.name === t.name) { P.crew = null; P.hp = 0; P.hpMax = 0; }
    else {
      P.crew = t; P.hp = t.at.str*2; P.hpMax = t.at.str*2;
      // Give starting items as empty slots
      P.inv = {};
      Object.entries(t.items||{}).forEach(([s,desc]) => {
        // Simple parse - just store name
        P.inv[s] = { k:'?', n:desc, e:'' };
      });
    }
    await setDoc(playerDoc(roomCode, playerId), { name:playerName, id:playerId, online:true, crew:P.crew||null, hp:P.hp, hpMax:P.hpMax, inv:P.inv, joinedAt:Date.now() });
    await updateDoc(gameDoc(roomCode), { [`players.${playerId}`]: { name:playerName, id:playerId, crew:P.crew||null, hp:P.hp, hpMax:P.hpMax, inv:P.inv } });
    renderPlayer();
  });

  // Vote
  document.querySelectorAll('[data-vote]').forEach(b => b.onclick = async () => {
    await updateDoc(gameDoc(roomCode), { [`votes.${playerId}`]: b.dataset.vote });
    toast('โหวต '+b.dataset.vote+' แล้ว');
  });

  // HP adjust
  document.querySelectorAll('[data-pheal]').forEach(b => b.onclick = async () => {
    P.hp = Math.max(-4, Math.min(P.hpMax, P.hp + parseInt(b.dataset.pheal)));
    await setDoc(playerDoc(roomCode, playerId), { name:playerName, id:playerId, crew:P.crew, hp:P.hp, hpMax:P.hpMax, inv:P.inv });
    await updateDoc(gameDoc(roomCode), { [`players.${playerId}.hp`]: P.hp });
    renderPlayer();
  });

  // Attack
  document.querySelectorAll('[data-attack]').forEach(b => b.onclick = async () => {
    const eid = b.dataset.attack, slot = b.dataset.slot;
    const w = slot === 'fist' ? { n:'หมัด', ty:'ML', hit:4, dmg:1 } : P.inv[slot];
    const r = d6();
    const need = w.hit || 4;
    if (r < need) { toast('พลาด! ('+r+' ต้อง '+need+'+)'); return; }
    const dmg = (w.dmg||1) + (r===6?1:0);
    pushLog(playerName+' โจมตีด้วย '+(w.n||'หมัด')+' ดาเมจ '+dmg, 'x');
    // Deal damage to enemy in game state
    const C = G.cmb;
    const e = C.en.find(x=>x.id===eid);
    if (e) { e.hp = Math.max(-10, e.hp-dmg); }
    await updateDoc(gameDoc(roomCode), { [`cmb.en`]:C.en, [`cmb.acted.${playerId}`]:true, log:G.log });
    toast('โจมตี '+dmg+' ดาเมจ '+(r===6?' CRIT!':''));
  });

  // Player actions
  document.querySelectorAll('[data-pact]').forEach(b => b.onclick = async () => {
    const a = b.dataset.pact;
    if (a === 'escape') {
      const cr = P.crew;
      const r = d6() + (cr?.at?.agi||1);
      toast('หนี: '+r+' — '+(r>=8?'สำเร็จ!':'ไม่สำเร็จ'));
    }
    if (a === 'cover') toast(playerName+' หลบกำบัง — ศัตรูโจมตียากขึ้น 1');
  });

  // Send item
  document.querySelectorAll('[data-send]').forEach(b => b.onclick = async () => {
    const s = b.dataset.send;
    const it = P.inv[s];
    if (!it) return;
    const players = Object.values(G.players||{}).filter(p=>p.id!==playerId&&p.crew);
    if (!players.length) { toast('ไม่มีเพื่อนที่จะส่งให้'); return; }
    // Simple: send to first available
    const tgt = players[0];
    delete P.inv[s];
    await setDoc(playerDoc(roomCode, playerId), { name:playerName, id:playerId, crew:P.crew, hp:P.hp, hpMax:P.hpMax, inv:P.inv });
    const iRef = inboxDoc(roomCode, tgt.id);
    const snap = await getDoc(iRef);
    const existing = snap.exists() ? (snap.data().items||[]) : [];
    await setDoc(iRef, { items: [...existing, it] });
    toast('ส่ง '+it.n+' ให้ '+tgt.name+' แล้ว 📤');
    renderPlayer();
  });

  // Buy
  document.querySelectorAll('[data-pbuy]').forEach(b => b.onclick = async () => {
    const [k,i] = b.dataset.pbuy.split(':');
    const list = k==='W' ? GEAR_W : GEAR_I;
    const it = list[+i];
    const PRICE=[0,2,5,12,30,70,150];
    const price = PRICE[it.g];
    if ((G.credits||0) < price) { toast('เครดิตไม่พอ'); return; }
    const sl = P.crew ? slots(P.crew).find(s=>!P.inv[s]) : null;
    if (sl) P.inv[sl] = { ...it }; else toast('ไม่มีช่องว่าง — ส่งเข้าคลังยาน');
    await updateDoc(gameDoc(roomCode), { credits: (G.credits||0)-price });
    await setDoc(playerDoc(roomCode, playerId), { name:playerName, id:playerId, crew:P.crew, hp:P.hp, hpMax:P.hpMax, inv:P.inv });
    toast('ซื้อ '+it.n+' '+price+'¢');
    renderPlayer();
  });
}

// ─── INBOX / ITEM RECEIVE ─────────────────────────────────
function showInbox(items) {
  const inbox = document.getElementById('inbox');
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'inbox-item';
    div.innerHTML = `📥 ได้รับ <b>${esc(it.n)}</b> — <button id="accept-inbox" style="border:none;background:var(--thrust);color:#000;padding:3px 8px;border-radius:4px;cursor:pointer">รับ</button>`;
    div.querySelector('#accept-inbox').onclick = async () => {
      const sl = P.crew ? slots(P.crew).find(s=>!P.inv[s]) : null;
      if (sl) { P.inv[sl] = it; await setDoc(playerDoc(roomCode, playerId), {name:playerName,id:playerId,crew:P.crew,hp:P.hp,hpMax:P.hpMax,inv:P.inv}); }
      await setDoc(inboxDoc(roomCode, playerId), { items: [] });
      div.remove(); toast('รับ '+it.n+' แล้ว');
    };
    inbox.appendChild(div);
    setTimeout(() => div.remove(), 15000);
  });
}

// ─── CHAR HELPERS ─────────────────────────────────────────
function slots(c) { const n=Math.floor((c.at?.str||4)/2); return['L','R',...Array.from({length:Math.min(4,n)},(_,i)=>String(i+1))]; }
function armorOf(p) { let a=0; Object.values(p.inv||{}).forEach(i=>{if(i?.arm)a+=i.arm}); return a; }
function shieldOf(p) { let b=null; Object.values(p.inv||{}).forEach(i=>{if(i?.sh&&(!b||i.sh.c>b.c))b=i.sh}); return b; }

// ─── BOOT ─────────────────────────────────────────────────
playerId = getOrMakePlayerId();
document.getElementById('splash').style.display = 'none';
root.style.display = 'flex';
renderRoot();
})(); // end async IIFE
</script>
